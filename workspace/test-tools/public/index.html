<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mini Task Manager</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Mini Task Manager</h1>

      <form id="add-form" class="add-form">
        <label for="new-task-title" class="visually-hidden">New task title</label>
        <input
          id="new-task-title"
          name="title"
          type="text"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="200"
        />
        <button type="submit" id="add-button">Add</button>
      </form>
      <p id="form-error" class="form-error" role="alert" hidden></p>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" aria-pressed="true">All</button>
          <button class="filter" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
        <span id="items-left" class="items-left" aria-live="polite">0 items left</span>
      </div>

      <ul id="task-list" class="task-list"></ul>

      <p id="empty-state" class="empty-state" hidden>No tasks here.</p>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
